<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mis Sílabas</title>
  <meta name="description" content="Juego para aprender a leer y escribir: junta consonantes con vocales y escucha cómo suenan." />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mis Sílabas" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="fondo" aria-hidden="true">
    <span class="burbuja"></span><span class="burbuja"></span><span class="burbuja"></span>
    <span class="burbuja"></span><span class="burbuja"></span><span class="burbuja"></span>
  </div>

  <header class="cabecera">
    <div class="marca">
      <span class="mascota" id="mascota">🦉</span>
      <h1>Mis Sílabas</h1>
    </div>
    <div class="acciones">
      <button class="chip" id="btn-caso" type="button" aria-label="Cambiar entre mayúsculas y minúsculas">Aa</button>
      <div class="estrellas" id="estrellas" aria-live="polite">⭐ <span id="num-estrellas">0</span></div>
    </div>
  </header>

  <main class="contenido">

    <!-- ===== PANTALLA: FORMAR ===== -->
    <section class="pantalla activa" id="pantalla-formar">
      <div class="tarjeta" id="tarjeta">
        <div class="ecuacion">
          <div class="ranura" id="ranura-consonante" data-vacia="true"><span class="letra"></span></div>
          <span class="signo">+</span>
          <div class="ranura ranura-vocal" id="ranura-vocal" data-vacia="true"><span class="letra"></span></div>
          <span class="signo">=</span>
          <div class="resultado" id="resultado"><span class="letra">?</span></div>
        </div>
        <div class="palabra" id="palabra" hidden>
          <span class="emoji" id="palabra-emoji"></span>
          <span class="texto" id="palabra-texto"></span>
        </div>
        <div class="botones-tarjeta" id="botones-tarjeta" hidden>
          <button class="boton boton-sonido" id="btn-oir" type="button">🔊 Escuchar</button>
          <button class="boton boton-lento" id="btn-lento" type="button">🐢 Despacio</button>
          <button class="boton boton-palabra" id="btn-palabra" type="button">🗣️ Palabra</button>
        </div>
      </div>

      <p class="pista" id="pista">Toca una consonante 👇</p>

      <div class="vocales" id="vocales"></div>
      <div class="consonantes" id="consonantes"></div>
    </section>

    <!-- ===== PANTALLA: ADIVINA ===== -->
    <section class="pantalla" id="pantalla-adivina">
      <div class="tarjeta tarjeta-juego">
        <p class="titulo-juego">¿Qué sílaba escuchaste?</p>
        <button class="boton-grande" id="btn-repetir" type="button" aria-label="Escuchar otra vez">🔊</button>
        <p class="pista">Toca para escuchar y luego elige</p>
      </div>
      <div class="opciones" id="opciones"></div>
      <div class="racha" id="racha"></div>
    </section>

    <!-- ===== PANTALLA: ESCRIBE ===== -->
    <section class="pantalla" id="pantalla-escribe">
      <div class="tarjeta tarjeta-escribe">
        <div class="barra-escribe">
          <button class="boton" id="btn-oir-trazo" type="button">🔊 Oír</button>
          <button class="boton" id="btn-otra" type="button">🎲 Otra</button>
          <button class="boton" id="btn-borrar" type="button">🧽 Borrar</button>
        </div>
        <div class="lienzo-envoltura">
          <canvas id="lienzo" width="600" height="360"></canvas>
        </div>
        <div class="crayones" id="crayones">
          <button class="crayon activo" data-color="#e8590c" style="--c:#e8590c" type="button" aria-label="Naranja"></button>
          <button class="crayon" data-color="#2f9e44" style="--c:#2f9e44" type="button" aria-label="Verde"></button>
          <button class="crayon" data-color="#1971c2" style="--c:#1971c2" type="button" aria-label="Azul"></button>
          <button class="crayon" data-color="#c2255c" style="--c:#c2255c" type="button" aria-label="Rosa"></button>
          <button class="crayon" data-color="#5f3dc4" style="--c:#5f3dc4" type="button" aria-label="Morado"></button>
        </div>
        <p class="pista">Repasa la sílaba con tu dedo ✍️</p>
      </div>
    </section>
  </main>

  <nav class="pestanas" aria-label="Secciones">
    <button class="pestana activa" data-pantalla="formar" type="button"><span>🧩</span>Formar</button>
    <button class="pestana" data-pantalla="adivina" type="button"><span>🎧</span>Adivina</button>
    <button class="pestana" data-pantalla="escribe" type="button"><span>✍️</span>Escribe</button>
  </nav>

  <div class="confeti" id="confeti" aria-hidden="true"></div>
  <div class="aviso" id="aviso" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
